<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: http: https: data:; media-src 'self' http: https: blob:; connect-src http: https:; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <title>Ember for Jellyfin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img id="backdrop" alt="" hidden />
    <div id="backdrop-shade" aria-hidden="true"></div>
    <header>
      <div id="brand">
        <span id="profile-initial" aria-label="Current profile">U</span
        ><strong>Ember</strong>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
    </header>
    <time id="wall-clock"></time>
    <p id="status" role="status" aria-live="polite"></p>
    <main id="main"></main>
    <section id="live-browse-info" aria-label="Highlighted programme">
      <h2 id="live-browse-title"></h2>
      <p id="live-browse-metadata"></p>
      <p id="live-browse-overview"></p>
    </section>
    <section id="player" hidden aria-label="Video player">
      <video id="video"></video>
      <div id="live-preview-caption"></div>
      <div id="seek-feedback" hidden role="status" aria-live="polite">
        <div id="seek-indicator"><img src="icons/seek-arrow.svg" alt="" /><span id="seek-seconds" aria-hidden="true"></span></div>
        <div id="seek-progress"><div></div></div>
      </div>
      <button id="skip-segment" hidden aria-live="polite"></button>
      <div id="controls">
        <div id="player-heading"><img id="player-logo" alt="" hidden /><time id="player-wall-clock"></time></div>
        <h2 id="playing-title"></h2>
        <p id="playing-year"></p>
        <div class="seek-row">
          <p id="end-time"></p>
          <p id="clock"></p>
          <input
            id="timeline"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
            aria-label="Playback position"
          />
          <span id="remaining-time"></span>
        </div>
        <div id="transport">
          <div class="transport-tools"><button id="player-options" aria-expanded="false" aria-controls="player-tools">Options</button></div>
          <div class="transport-main">
            <button id="previous-video" aria-label="Previous video" title="Previous video"></button>
            <button
              id="rewind"
              aria-label="Back 30 seconds"
              title="Back 30 seconds"
            ></button>
            <button id="toggle" aria-label="Pause" title="Pause"></button>
            <button
              id="forward"
              aria-label="Forward 30 seconds"
              title="Forward 30 seconds"
            ></button>
            <button
              id="next-video"
              aria-label="Next video"
              title="Next video"
            ></button>
          </div>
          <div class="transport-tracks">
            <button id="subtitles">Subtitles</button>
            <button id="audio">Audio</button>
          </div>
        </div>
        <div id="player-tools" hidden>
          <div class="player-tool-group"><span>Playback</span><button id="chapters">Chapters</button><button id="queue">Queue</button></div>
          <div class="player-tool-group"><span>Subtitles</span><button id="subtitle-timing" aria-label="Subtitle timing">Timing</button><button id="subtitle-appearance" aria-label="Subtitle appearance">Appearance</button></div>
          <div class="player-tool-group"><span>Display &amp; diagnostics</span><button id="fit">Fill screen</button><button id="playback-info">Playback info</button></div>
        </div>
      </div>
      <section
        id="playback-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Playback options"
        hidden
      ></section>
    </section>
    <script src="platform.js"></script>
    <script src="core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
